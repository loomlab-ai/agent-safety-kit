name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke check
        run: |
          set -eu
          ls
          test -f README.md
          test -f LICENSE
          test -f skills/permission-gate/SKILL.md
          test -f skills/git-guard/SKILL.md
          test -f skills/money-denylist/SKILL.md
          test -f skills/secret-scrub/SKILL.md
          echo "schema: schemas/findings.schema.json"
          echo "demo: demos/findings-example.json"
          test -f schemas/findings.schema.json
          test -f demos/findings-example.json
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path

          schema = json.loads(Path("schemas/findings.schema.json").read_text())
          doc = json.loads(Path("demos/findings-example.json").read_text())
          defs = schema["$defs"]

          def fail(msg):
              print(msg, file=sys.stderr)
              sys.exit(1)

          def check(instance, sch, path):
              if "$ref" in sch:
                  name = sch["$ref"].rsplit("/", 1)[-1]
                  return check(instance, defs[name], path)
              kind = sch.get("type")
              if kind == "object":
                  if not isinstance(instance, dict):
                      fail(f"{path}: expected object")
                  if sch.get("additionalProperties") is False:
                      extra = set(instance) - set(sch.get("properties", {}))
                      if extra:
                          fail(f"{path}: extra keys {sorted(extra)}")
                  for key in sch.get("required", []):
                      if key not in instance:
                          fail(f"{path}: missing {key}")
                  for key, sub in sch.get("properties", {}).items():
                      if key in instance:
                          check(instance[key], sub, f"{path}.{key}")
                  return
              if kind == "array":
                  if not isinstance(instance, list):
                      fail(f"{path}: expected array")
                  if len(instance) < sch.get("minItems", 0):
                      fail(f"{path}: too few items")
                  for index, item in enumerate(instance):
                      check(item, sch["items"], f"{path}[{index}]")
                  return
              if kind == "string":
                  if not isinstance(instance, str):
                      fail(f"{path}: expected string")
                  if "const" in sch and instance != sch["const"]:
                      fail(f"{path}: expected {sch['const']!r}")
                  if "enum" in sch and instance not in sch["enum"]:
                      fail(f"{path}: {instance!r} not in {sch['enum']}")
                  if len(instance) < sch.get("minLength", 0):
                      fail(f"{path}: too short")
                  if "maxLength" in sch and len(instance) > sch["maxLength"]:
                      fail(f"{path}: too long")
                  if "pattern" in sch and re.fullmatch(sch["pattern"], instance) is None:
                      fail(f"{path}: pattern mismatch")
                  return
              fail(f"{path}: unsupported schema type {kind!r}")

          finding = schema["$defs"]["finding"]["properties"]
          if finding["severity"]["enum"] != ["info", "warn", "block"]:
              fail("severity enum drifted")
          if finding["status"]["enum"] != ["confirmed", "needs_review", "dismissed"]:
              fail("status enum drifted")
          check(doc, schema, "$")
          skills = {item["skill"] for item in doc["findings"]}
          missing = {"permission-gate", "secret-scrub"} - skills
          if missing:
              fail(f"demo missing skills {sorted(missing)}")
          blob = json.dumps(doc)
          for needle in ("ghp_", "sk-", "AKIA", "BEGIN ", "password="):
              if needle in blob:
                  fail(f"demo embeds secret-like text {needle!r}")
          print(f"findings demo ok ({len(doc['findings'])} records)")
          PY
